name: Used Cars Price Prediction MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Compute Cluster Setup
  setup-compute:
    uses: ./.github/workflows/custom-create-compute.yml
    with:
      cluster_name: "cpu-cluster"
      size: "Standard_DS11_v2"
      min_instances: 0
      max_instances: 1
      resource_group: "default_resourse_group"
      workspace_name: "demo_workspace"
      cluster_tier: "Dedicated"
    secrets:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  # 2. Register Dataset
  register-data:
    needs: setup-compute
    uses: ./.github/workflows/custom-register-dataset.yml
    with:
      data_file: "config/data.yml"
      name: "used-cars-data"
      resource_group: "default_resourse_group"
      workspace_name: "demo_workspace"
    secrets:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  # 3. Register Environment
  register-environment:
    needs: setup-compute
    uses: ./.github/workflows/custom-register-environment.yml
    with:
      environment_file: "config/train-env.yml"
      conda_file: "data-science/environment/train-conda.yml"
      resource_group: "default_resourse_group"
      workspace_name: "demo_workspace"
    secrets:
      creds: ${{ secrets.AZURE_CREDENTIALS }}

  # 4. Run Azure ML Pipeline
  run-pipeline:
    needs: [register-data, register-environment]
    uses: ./.github/workflows/custom-run-pipeline.yml
    with:
      parameters-file: "config/newpipeline.yml"
      job-name: "used-cars-pricing-run"
      resource_group: "default_resourse_group"
      workspace_name: "demo_workspace"
    secrets:
      creds: ${{ secrets.AZURE_CREDENTIALS }}
